name: Fork Bundle Upstream PR
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'PR title (optional, auto-generated if omitted)'
        required: false
        default: ''
      description:
        description: 'PR description (optional)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  bundle_upstream_pr:
    name: Bundle Agent Changes into Upstream PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/github/awesome-copilot.git || true
          git fetch upstream main --quiet

      - name: Identify commits to promote
        id: changes
        run: |
          # Load last promotion state
          LAST_PROMOTED=$(jq -r '.lastPromotedSHA' .github/fork-only/state/upstream-promotion.json)
          CURRENT_HEAD=$(git rev-parse HEAD)

          # Find commits between last promoted and current HEAD that touch agent/plugin paths
          COMMITS=$(git log ${LAST_PROMOTED}..HEAD --format="%H" -- \
            "agents/oracle-to-postgres-migration-expert.agent.md" \
            "plugins/oracle-to-postgres-migration-expert/" || echo "")

          if [ -z "$COMMITS" ]; then
            echo "::notice::No promotable changes found since last promotion."
            exit 1
          fi

          COMMIT_COUNT=$(echo "$COMMITS" | wc -l)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "last_promoted=$LAST_PROMOTED" >> $GITHUB_OUTPUT
          echo "Found $COMMIT_COUNT promotable commits"

      - name: Create promotion branch
        id: branch
        run: |
          BRANCH_NAME="fork-promotion-$(date +%s)"
          git config user.name "GitHub Actions (Fork Bundler)"
          git config user.email "noreply@github.com"

          # Create branch from upstream/main
          git checkout -b $BRANCH_NAME upstream/main --quiet

          # Cherry-pick commits
          for COMMIT in ${{ steps.changes.outputs.commits }}; do
            echo "Cherry-picking $COMMIT"
            git cherry-pick $COMMIT --quiet || {
              echo "::warning::Conflict or failure on $COMMIT; attempting auto-resolve"
              git cherry-pick --abort || true
            }
          done

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git push origin $BRANCH_NAME --quiet

      - name: Generate PR title and body
        id: pr_content
        run: |
          if [ -z "${{ github.event.inputs.title }}" ]; then
            TITLE="[Fork Promotion] Oracle-to-PostgreSQL Migration Expert Agent Updates"
          else
            TITLE="${{ github.event.inputs.title }}"
          fi

          if [ -z "${{ github.event.inputs.description }}" ]; then
            BODY="This PR bundles changes from the fork's Oracle-to-PostgreSQL Migration Expert development.

## Changes
- Agent improvements and refinements
- Plugin metadata updates
- Documentation enhancements

## Testing
Please review for:
- Consistency with upstream standards
- No breaking changes to existing agent behavior
- Alignment with Awesome Copilot contribution guidelines

## Source
This PR was generated by fork-bundle-upstream-pr workflow.
Promotion ID: ${{ github.run_id }}
Fork branch: ${{ steps.branch.outputs.branch_name }}"
          else
            BODY="${{ github.event.inputs.description }}"
          fi

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          # Save body to file for use in next step
          echo "$BODY" > /tmp/pr_body.txt

      - name: Create upstream PR (draft)
        id: create_pr
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr_body.txt', 'utf8');
            const result = await exec.getExecOutput('gh', [
              'pr', 'create',
              '--repo', 'github/awesome-copilot',
              '--title', '${{ steps.pr_content.outputs.title }}',
              '--body', body,
              '--head', '${{ github.repository_owner }}:${{ steps.branch.outputs.branch_name }}',
              '--base', 'main',
              '--draft'
            ]);
            console.log(result.stdout);

      - name: Record promotion state
        if: success()
        run: |
          # Update upstream-promotion.json with new promotion entry
          PROMOTION_ID="promo-$(date +%s)"
          NEW_SHA=$(git rev-parse origin/${{ steps.branch.outputs.branch_name }})

          jq ".promotions += [{
            \"id\": \"$PROMOTION_ID\",
            \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",
            \"forkHeadBefore\": \"$(git rev-parse HEAD)\",
            \"promoteHeadBefore\": \"${{ steps.changes.outputs.last_promoted }}\",
            \"branchName\": \"${{ steps.branch.outputs.branch_name }}\",
            \"commitCount\": ${{ steps.changes.outputs.commit_count }},
            \"status\": \"pr-opened\",
            \"notes\": \"PR opened at $(date -u +'%Y-%m-%dT%H:%M:%SZ')\",
            \"workflowRunUrl\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }]" \
          .github/fork-only/state/upstream-promotion.json > /tmp/promotion.tmp

          jq ".lastPromotedSHA = \"$NEW_SHA\"" /tmp/promotion.tmp > /tmp/promotion.tmp2

          mv /tmp/promotion.tmp2 .github/fork-only/state/upstream-promotion.json

          git add .github/fork-only/state/upstream-promotion.json
          git commit -m "chore(fork-promote): record promotion $PROMOTION_ID" --quiet
          git push origin main --quiet

      - name: Notify completion
        run: |
          echo "::notice::Promotion workflow completed"
          echo "::notice::Branch: ${{ steps.branch.outputs.branch_name }}"
          echo "::notice::Commits promoted: ${{ steps.changes.outputs.commit_count }}"
          echo "::notice::PR opened as draft — review and merge when ready"
