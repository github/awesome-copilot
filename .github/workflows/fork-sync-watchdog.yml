name: Fork Sync Watchdog
on:
  schedule:
    - cron: '0 10 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_and_watch:
    name: Sync from Upstream & Check Contribution Instructions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/github/awesome-copilot.git || true
          git fetch upstream main --quiet

      - name: Merge upstream main into fork main
        run: |
          git config user.name "GitHub Actions (Fork Sync)"
          git config user.email "noreply@github.com"
          git merge upstream/main --no-edit --quiet || {
            echo "::notice::Merge conflict detected. Requires manual resolution."
            exit 1
          }
          git push origin main --quiet

      - name: Check CONTRIBUTING.md and AGENTS.md changes
        id: check_contrib
        run: |
          # Load last-known SHAs from state file
          CONTRIB_OLD=$(jq -r '.trackedFiles."CONTRIBUTING.md".lastSeenSHA' .github/fork-only/state/contrib-watch.json)
          AGENTS_OLD=$(jq -r '.trackedFiles."AGENTS.md".lastSeenSHA' .github/fork-only/state/contrib-watch.json)

          # Get current SHAs from upstream
          CONTRIB_NEW=$(git ls-remote upstream CONTRIBUTING.md | head -1 | awk '{print $1}' || git log -1 --format="%H" upstream/main -- CONTRIBUTING.md)
          AGENTS_NEW=$(git ls-remote upstream AGENTS.md | head -1 | awk '{print $1}' || git log -1 --format="%H" upstream/main -- AGENTS.md)

          echo "contrib_changed=$([ "$CONTRIB_OLD" != "$CONTRIB_NEW" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "agents_changed=$([ "$AGENTS_OLD" != "$AGENTS_NEW" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "contrib_new=$CONTRIB_NEW" >> $GITHUB_OUTPUT
          echo "agents_new=$AGENTS_NEW" >> $GITHUB_OUTPUT

      - name: Update contrib-watch.json
        if: steps.check_contrib.outputs.contrib_changed == 'true' || steps.check_contrib.outputs.agents_changed == 'true'
        run: |
          jq ".trackedFiles[\"CONTRIBUTING.md\"].lastSeenSHA = \"${{ steps.check_contrib.outputs.contrib_new }}\"" \
            .github/fork-only/state/contrib-watch.json > /tmp/contrib-watch.tmp
          mv /tmp/contrib-watch.tmp .github/fork-only/state/contrib-watch.json

          jq ".trackedFiles[\"AGENTS.md\"].lastSeenSHA = \"${{ steps.check_contrib.outputs.agents_new }}\"" \
            .github/fork-only/state/contrib-watch.json > /tmp/contrib-watch.tmp
          mv /tmp/contrib-watch.tmp .github/fork-only/state/contrib-watch.json

          jq ".lastRun = \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"" \
            .github/fork-only/state/contrib-watch.json > /tmp/contrib-watch.tmp
          mv /tmp/contrib-watch.tmp .github/fork-only/state/contrib-watch.json

          git add .github/fork-only/state/contrib-watch.json
          git commit -m "chore(fork-sync): update contrib-watch state" --quiet
          git push origin main --quiet

      - name: Alert if contribution instructions changed
        if: steps.check_contrib.outputs.contrib_changed == 'true' || steps.check_contrib.outputs.agents_changed == 'true'
        run: |
          echo "::notice::Upstream contribution instructions were updated."
          echo "::notice::CONTRIBUTING.md changed: ${{ steps.check_contrib.outputs.contrib_changed }}"
          echo "::notice::AGENTS.md changed: ${{ steps.check_contrib.outputs.agents_changed }}"
          echo "::notice::Review upstream changes and update your fork's guidelines if needed."
