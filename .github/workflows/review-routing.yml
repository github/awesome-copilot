name: Review Routing

# Requests a reviewer from the pool configured in .github/review-routing.yml
# and marks the PR with a `review-due:YYYY-MM-DD` label.
#
# Triggers:
# - workflow_run of "Label PR Intent": route newly labeled PRs (trusted artifact).
# - workflow_run of "Review Routing Request": a human added `needs-reviewer`.
# - workflow_dispatch with pr_number: automation (e.g. `/request-review`) asks
#   for routing after adding `needs-reviewer` with GITHUB_TOKEN.
# - schedule / workflow_dispatch without pr_number: sweep all open PRs that are
#   unrouted or carry `needs-reviewer`.
#
# Only trusted code from the default branch is checked out. PR code is never
# checked out or executed.

on:
  workflow_run:
    workflows: ["Label PR Intent", "Review Routing Request"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to route (leave empty to sweep all open PRs)"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: review-routing-${{ github.event_name == 'workflow_run' && format('{0}-{1}', github.event.workflow_run.head_repository.id, github.event.workflow_run.head_branch) || (github.event_name == 'workflow_dispatch' && inputs.pr_number) || 'sweep' }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download reader artifact
        id: download
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.workflow_run.name == 'Label PR Intent' && 'label-pr-intent-result' || 'review-routing-request' }}
          path: ${{ runner.temp }}/review-routing-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Route reviewers
        if: github.event_name != 'workflow_run' || steps.download.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');

            const routing = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'eng', 'review-routing.mjs')).href);
            const config = routing.loadReviewRoutingConfig(path.join(process.env.GITHUB_WORKSPACE, '.github', 'review-routing.yml'));
            const { owner, repo } = context.repo;
            const args = { github, owner, repo, config, log: core };

            let results;
            if (context.eventName === 'workflow_run') {
              const artifact = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'review-routing-input', 'result.json'), 'utf8'));
              const resolved = await routing.resolveWorkflowRunArtifact({
                github,
                owner,
                repo,
                workflowRun: context.payload.workflow_run,
                artifact,
              });
              if (resolved.skip) {
                core.info(`Skipping: ${resolved.skip}`);
                results = [];
              } else {
                results = await routing.routePullRequest({ ...args, prNumber: resolved.prNumber, intentLabels: resolved.intentLabels });
              }
            } else if (process.env.PR_NUMBER_INPUT) {
              const prNumber = Number(process.env.PR_NUMBER_INPUT);
              if (!Number.isInteger(prNumber) || prNumber < 1) {
                core.setFailed(`Invalid pr_number input: ${process.env.PR_NUMBER_INPUT}`);
                return;
              }
              results = await routing.routePullRequest({ ...args, prNumber });
            } else {
              results = await routing.runRoutingSweep(args);
            }

            await core.summary
              .addRaw(routing.formatResultsSummary(results.filter((result) => result.action !== 'skip' || context.eventName !== 'schedule'), { title: 'Review routing', dryRun: config.dryRun }))
              .write();

      - name: Note missing artifact
        if: github.event_name == 'workflow_run' && steps.download.outcome != 'success'
        run: echo "No reader artifact was available; nothing to route."
