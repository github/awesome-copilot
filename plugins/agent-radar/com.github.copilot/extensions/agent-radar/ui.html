<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Agent Radar</title>
<link rel="icon" href="data:," />
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--background-color-default, #0d1117);
    color: var(--text-color-default, #e6edf3);
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    font-size: var(--text-body-small, 12px);
    display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto minmax(0, 1fr) var(--feedH, 36vh); height: 100vh;
  }
  header {
    grid-column: 1 / 3; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px;
    border-bottom: 1px solid var(--border-color-default, #30363d);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: var(--font-weight-semibold, 600); letter-spacing: .02em; }
  header .stat { color: var(--text-color-muted, #8b949e); }
  header .stat b { color: var(--text-color-default, #e6edf3); }
  header label { margin-left: auto; color: var(--text-color-muted, #8b949e); cursor: pointer; user-select: none; }
  header .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok, #3fb950); box-shadow: 0 0 8px var(--ok, #3fb950); animation: blink 1.6s infinite; }
  header .live.off { background: var(--bad, #f85149); box-shadow: 0 0 8px var(--bad, #f85149); animation: none; }
  @keyframes blink { 50% { opacity: .35; } }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: auto; }
  canvas { width: 100%; display: block; }
  #graphHint { position: sticky; top: 32px; left: 8px; z-index: 2; width: fit-content; height: 26px; box-sizing: border-box; margin: 0 8px -26px; padding: 5px 8px;
    border: 1px solid var(--border-color-default, #30363d); border-radius: 6px; background: var(--background-color-default, #0d1117); color: var(--text-color-muted, #8b949e); font-size: 11px; pointer-events: none; }
  #legend { position: sticky; bottom: 0; margin-top: -28px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 10px; color: var(--text-color-muted, #8b949e); pointer-events: none;
    background: color-mix(in srgb, var(--background-color-default, #0d1117) 85%, transparent); }
  #legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  #legend .subagent::before { border-radius: 0; transform: rotate(45deg); }
  #legend .shell::before { border-radius: 0; }
  #tip { position: absolute; pointer-events: none; max-width: 360px; padding: 8px 10px; border-radius: 8px; display: none;
    background: color-mix(in srgb, var(--background-color-default, #0d1117) 92%, transparent);
    border: 1px solid var(--border-color-default, #30363d); box-shadow: 0 8px 24px rgba(0,0,0,.35); line-height: 1.45; z-index: 3; }
  #tip .t { font-weight: 600; margin-bottom: 2px; }
  #tip > div { overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #tip .m { color: var(--text-color-muted, #8b949e); }
  aside { border-left: 1px solid var(--border-color-default, #30363d); overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; }
  #list { overflow-y: auto; padding: 8px; min-height: 0; }
  .card { border: 1px solid var(--border-color-default, #30363d); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
  .card:hover, .card.sel { border-color: var(--c, #8957e5); background: color-mix(in srgb, var(--c, #8957e5) 8%, transparent); }
  .card .row { display: flex; align-items: center; gap: 6px; }
  .card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .card .meta { color: var(--text-color-muted, #8b949e); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .doing { margin-top: 5px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub { margin: 3px 0 0 10px; color: var(--text-color-muted, #8b949e); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub b { color: var(--text-color-default, #e6edf3); font-weight: 500; }
  .card:focus-visible { outline: 2px solid var(--c, #8957e5); outline-offset: 1px; }
  .card.dest { padding: 6px 10px; }
  .card[aria-expanded="true"] { border-radius: 8px 8px 0 0; }
  .details { border: 1px solid var(--c, #8957e5); border-top: none; border-radius: 0 0 8px 8px; margin: -9px 0 8px; padding: 6px 10px; line-height: 1.45; overflow-wrap: anywhere;
    background: color-mix(in srgb, var(--c, #8957e5) 4%, transparent); }
  .details .m { color: var(--text-color-muted, #8b949e); }
  .details details { margin-top: 4px; }
  .details summary { cursor: pointer; }
  .details summary:focus-visible { outline: 2px solid var(--c, #8957e5); outline-offset: 1px; }
  .details details > div { margin-left: 14px; }
  .card.dest .name { color: var(--text-color-default, #e6edf3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #6e7681; }
  .dot.busy { background: var(--ok, #3fb950); box-shadow: 0 0 6px var(--ok, #3fb950); animation: blink 1s infinite; }
  .dot.wait { background: var(--warn, #d29922); box-shadow: 0 0 6px var(--warn, #d29922); animation: blink .6s infinite; }
  .pill { font-size: 10px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--c); color: var(--text-color-default, #e6edf3); flex: none; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-color-muted, #8b949e); margin: 6px 2px 8px; font-weight: 600; }
  #feedWrap { grid-column: 1 / 3; border-top: 1px solid var(--border-color-default, #30363d); display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); min-height: 0; position: relative; }
  #models { grid-column: 2; grid-row: 1 / 3; border-left: 1px solid var(--border-color-default, #30363d); overflow-y: auto; padding: 0 10px 8px; min-height: 0; }
  #models h2 { margin: 7px 0; }
  .mdl { border: 1px solid var(--border-color-default, #30363d); border-left: 3px solid var(--c); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
  .mdl .top { display: flex; align-items: baseline; gap: 6px; }
  .mdl .nm { font-weight: 600; color: var(--text-color-default, #e6edf3); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mdl.idle { opacity: .55; }
  .mdl .act { color: var(--ok, #3fb950); font-size: 10px; animation: blink 1.6s infinite; }
  .mdl .ago { color: var(--text-color-muted, #8b949e); font-size: 10px; }
  .mdl .rate { font-variant-numeric: tabular-nums; font-weight: 600; }
  .mdl .nums { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 0 10px; margin-top: 3px; font-variant-numeric: tabular-nums; color: var(--text-color-muted, #8b949e); }
  .mdl .nums b { color: var(--text-color-default, #e6edf3); font-weight: 500; text-align: right; }
  .mdl .nums span { text-align: right; }
  .mdl .bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 5px; background: color-mix(in srgb, var(--c) 15%, transparent); }
  .mdl .bar i { display: block; height: 100%; }
  .mdl .who { margin-top: 3px; color: var(--text-color-muted, #8b949e); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #feedHead { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
  #feedHead h2 { margin: 7px 0; }
  #feedHead .hint { color: var(--text-color-muted, #8b949e); }
  #grip { position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; z-index: 4; }
  #grip:focus-visible { outline: none; background: color-mix(in srgb, var(--text-color-default, #e6edf3) 35%, transparent); }
  #feed { overflow: auto; min-height: 0; }
  #feed table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #feed th { position: sticky; top: 0; text-align: left; font-weight: 600; color: var(--text-color-muted, #8b949e); padding: 3px 8px; font-size: 11px;
    background: var(--background-color-default, #0d1117); border-bottom: 1px solid var(--border-color-default, #30363d); }
  #feed td { padding: 3px 8px; border-bottom: 1px dashed color-mix(in srgb, var(--border-color-default, #30363d) 55%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  #feed tr.live td { background: color-mix(in srgb, var(--ok, #3fb950) 7%, transparent); }
  #feed tr.fail .dest::after { content: " ✗"; color: var(--bad, #f85149); }
  #feed .ts { color: var(--text-color-muted, #8b949e); font-variant-numeric: tabular-nums; }
  #feed .dest { color: var(--text-color-default, #e6edf3); font-weight: 600; }
  #feed .dest::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  #feed .agent { color: var(--text-color-muted, #8b949e); }
  #feed .cmd { font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; white-space: pre-wrap; word-break: break-all; overflow: visible; }
  #feed .cmd div { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #feed tr.peer .cmd { white-space: nowrap; overflow: hidden; }
  .empty { color: var(--text-color-muted, #8b949e); padding: 20px 6px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="live" id="live" aria-hidden="true"></div>
  <h1>Agent Radar</h1>
  <span class="stat" id="conn" role="status" aria-live="polite">connecting…</span>
  <span class="stat"><b id="sBusy">0</b> working</span>
  <span class="stat"><b id="sWait">0</b> waiting on you</span>
  <span class="stat"><b id="sSub">0</b> running sub-agents<span id="subHistory"></span></span>
  <span class="stat"><b id="sShell">0</b> background shells</span>
  <span class="stat"><b id="sAll">0</b> sessions</span>
  <span class="stat"><b id="sFlow">0</b> flows / 2 min</span>
  <label><input type="checkbox" id="showIdle" /> show idle / completed</label>
</header>
<div id="stage">
  <div id="graphHint" hidden>↔ Scroll to explore the full graph</div>
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="tip"></div>
  <div id="legend"></div>
</div>
<aside>
  <div id="list" aria-label="Agents and data destinations"></div>
</aside>
<section id="feedWrap">
  <div id="grip" title="Drag to resize" role="separator" aria-orientation="horizontal" aria-label="Resize the data flow feed" tabindex="0"></div>
  <div id="feedHead"><h2>Data flow feed</h2><span class="hint" id="feedCount"></span></div>
  <div id="feed"></div>
  <div id="models"></div>
</section>
<script>
// Two palettes with a contrast of 3:1 or more on the host background. Colors stay in #rrggbb
// form, because the renderer adds an alpha suffix.
const PALETTES = {
  dark: { app: "#a371f7", vscode: "#2f81f7", cli: "#f778ba", chat: "#39c5cf", other: "#8b949e", llm: "#f2cc60", warn: "#d29922", ok: "#3fb950", bad: "#f85149", back: "#ffffff", hashLit: .65,
    sinks: { "GitHub": "#e6edf3", "Git": "#f0883e", "Web": "#58a6ff", "Shell": "#7ee787", "Build / run": "#56d364", "Filesystem": "#d2a8ff", "SSH hosts": "#ffdf5d", "Containers": "#1f9bf0",
      "You": "#d29922", "Session DB": "#8b949e", "Copilot Memory": "#bc8cff", "Memory (local)": "#bc8cff" },
    bars: ["#a371f7", "#2f81f7", "#39c5cf", "#3fb950", "#f778ba", "#d29922", "#ff7b72"] },
  light: { app: "#8250df", vscode: "#0969da", cli: "#bf3989", chat: "#1b7c83", other: "#6e7781", llm: "#9a6700", warn: "#9a6700", ok: "#1a7f37", bad: "#cf222e", back: "#24292f", hashLit: .32,
    sinks: { "GitHub": "#24292f", "Git": "#bc4c00", "Web": "#0969da", "Shell": "#1a7f37", "Build / run": "#116329", "Filesystem": "#8250df", "SSH hosts": "#7d4e00", "Containers": "#0550ae",
      "You": "#9a6700", "Session DB": "#57606a", "Copilot Memory": "#6639ba", "Memory (local)": "#6639ba" },
    bars: ["#8250df", "#0969da", "#1b7c83", "#1a7f37", "#bf3989", "#9a6700", "#cf222e"] },
};
// Use the light palette when the host background is light. Check again on each snapshot and
// when the system color scheme changes.
const schemeQuery = matchMedia("(prefers-color-scheme: light)");
// A 1×1 canvas converts any CSS color form (rgb, hex, oklch) to RGB values.
const probe = document.createElement("canvas").getContext("2d", { willReadFrequently: true });
function bgIsLight() {
  probe.clearRect(0, 0, 1, 1); probe.fillStyle = getComputedStyle(document.body).backgroundColor; probe.fillRect(0, 0, 1, 1);
  const [r, g, b, a] = probe.getImageData(0, 0, 1, 1).data;
  if (!a) return schemeQuery.matches;
  const lin = (v) => (v /= 255) <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4;
  return .2126 * lin(r) + .7152 * lin(g) + .0722 * lin(b) > .4;
}
let P = PALETTES.dark;
function updateTheme() {
  const next = bgIsLight() ? PALETTES.light : PALETTES.dark;
  if (next === P && document.getElementById("legend").innerHTML) return false;
  P = next;
  for (const k of ["ok", "warn", "bad"]) document.body.style.setProperty("--" + k, P[k]);
  document.getElementById("legend").innerHTML = `<span class="subagent" style="--c:${P.other}">sub-agent (diamond)</span><span class="shell" style="--c:${P.other}">background shell (square)</span>` + [["child session (solid link)", P.other], ["message (one-shot dot)", P.cli], ["Copilot app", P.app], ["VS Code agent", P.vscode], ["VS Code chat", P.chat], ["LLM", P.llm], ["data sink ▢", P.other]]
    .map(([n, c]) => `<span style="--c:${c}">${n}</span>`).join("");
  return true;
}
const surfaceColor = (s) => ({ "Copilot app": P.app, "VS Code agent": P.vscode, "Copilot CLI": P.cli })[s] || (/chat$/.test(s) ? P.chat : P.other);
// MCP servers and CLIs get a stable color from a hash of the name.
const hashColor = (s) => {
  let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) | 0;
  const hue = ((h % 360) + 360) % 360, sat = .7, lit = P.hashLit, a = sat * Math.min(lit, 1 - lit);
  const f = (n) => { const k = (n + hue / 30) % 12; return Math.round(255 * (lit - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, "0"); };
  return "#" + f(0) + f(8) + f(4);
};
const sinkColor = (s) => s.startsWith("LLM:") ? P.llm : (P.sinks[s] || hashColor(s));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = (t) => { if (!t) return ""; const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? `${s | 0}s` : s < 3600 ? `${(s / 60) | 0}m` : `${(s / 3600) | 0}h`; };

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip"), stage = document.getElementById("stage");
// Scroll rather than compress the hierarchy or let adjacent labels overlap.
let W = 0, H = 0, DPR = 1, contentH = 0, contentW = 900;
function resize() {
  DPR = window.devicePixelRatio || 1;
  const w = Math.max(contentW, stage.clientWidth), h = Math.max(stage.clientHeight, contentH);
  document.getElementById("graphHint").hidden = w <= stage.clientWidth;
  if (w === W && h === H && cv.width === Math.round(w * DPR)) return;
  W = w; H = h; cv.style.width = W + "px"; cv.style.height = H + "px"; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
resize();

// ---------- Layout model (fixed columns, stable rows) ----------
const nodes = new Map();
let links = [], particles = [], snapshot = null, selected = null, hover = null;
let messagePulses = [], messageFloor = null;
const seenMessages = new Map();
// Only destinations that keep the data on this computer. Shell, build, and container commands can
// send data to remote systems (kubectl apply, docker push, npm publish), so they are tools & services.
const LOCAL_SINKS = new Set(["Filesystem", "Session DB", "You", "Memory (local)"]);
const sinkGroup = (s) => s.startsWith("LLM:") ? 0 : LOCAL_SINKS.has(s) ? 1 : 2;
const GROUP_NAMES = ["MODELS", "LOCAL MACHINE", "TOOLS & SERVICES"];
const SURFACE_ORDER = ["Copilot app", "Copilot CLI", "VS Code agent"];
let headers = [], groupLabels = [];
// Honor the system setting to reduce motion: no particles, pulse rings, easing, or smooth scrolling.
const motionQuery = matchMedia("(prefers-reduced-motion: reduce)");
let reduceMotion = motionQuery.matches;
motionQuery.addEventListener("change", (e) => { reduceMotion = e.matches; if (reduceMotion) particles = []; });

function upsert(id, props) {
  let n = nodes.get(id);
  if (!n) { n = { id, x: props.tx, y: props.ty, born: performance.now() }; nodes.set(id, n); }
  Object.assign(n, props, { seen: true });
  return n;
}

function build(snap) {
  if (!snap?.sessions) return;
  updateTheme();
  snapshot = snap;
  const showIdle = document.getElementById("showIdle").checked;
  const now = snap.now;
  for (const n of nodes.values()) n.seen = false;
  links = [];
  const L = (a, b, o = {}) => links.push({ a, b, ...o });

  const all = new Map(snap.sessions.map((s) => [s.id, s])), parentOf = new Map();
  for (const s of [...snap.sessions].sort((a, b) => a.id.localeCompare(b.id))) for (const id of s.childSessions || []) {
    if (!all.has(id) || id === s.id || parentOf.has(id)) continue;
    let ancestor = s.id;
    while (ancestor && ancestor !== id) ancestor = parentOf.get(ancestor);
    if (ancestor !== id) parentOf.set(id, s.id);
  }
  const active = (s) => s.busy || s.waiting || s.backgroundShells?.length || s.subagents.some((a) => a.running);
  const visible = new Set(snap.sessions.filter((s) => showIdle || active(s)).map((s) => s.id));
  for (const id of visible) {
    const parent = parentOf.get(id);
    if (parent) visible.add(parent);
  }
  const sessions = snap.sessions.filter((s) => visible.has(s.id))
    .map((s) => ({ ...s, contextOnly: !showIdle && !active(s), subagents: showIdle ? s.subagents : s.subagents.filter((a) => a.running) }));
  const byID = new Map(sessions.map((s) => [s.id, s]));
  const childrenOf = new Map(sessions.map((s) => [s.id, []]));
  for (const s of sessions) if (byID.has(parentOf.get(s.id))) childrenOf.get(parentOf.get(s.id)).push(s);
  for (const children of childrenOf.values()) children.sort((a, b) => a.name.localeCompare(b.name) || a.id.localeCompare(b.id));
  const roots = sessions.filter((s) => !byID.has(parentOf.get(s.id)));
  const ownRows = (s) => 1 + s.subagents.length + (s.backgroundShells?.length || 0);
  const treeSlots = new Map();
  const measureTree = (s, depth = 0) => {
    s.depth = depth;
    const slots = ownRows(s) + .4 + childrenOf.get(s.id).reduce((n, child) => n + measureTree(child, depth + 1), 0);
    treeSlots.set(s.id, slots);
    return slots;
  };
  for (const s of roots) measureTree(s);
  contentW = 900 + Math.max(0, ...sessions.map((s) => s.depth)) * 80;

  // Assign each session to a hub (surface, or the VS Code window it lives in).
  const normPath = (p) => { let n = String(p || "").replace(/\\/g, "/").replace(/\/+$/, ""); return /^[A-Za-z]:(\/|$)/.test(n) ? n.toLowerCase() : n; };
  const inFolder = (cwd, folder) => { const c = normPath(cwd), f = normPath(folder); return !!c && !!f && (c === f || c.startsWith(f + "/")); };
  const hubOf = (s) => {
    if (s.kind === "vscode-chat" || s.surface === "VS Code agent") {
      const roots = (s.folders?.length ? s.folders : [s.cwd]).filter(Boolean);
      const ide = snap.ides.find((i) => roots.some((c) => i.folders.some((f) => inFolder(c, f))));
      return ide ? { id: "ide:" + ide.id, label: "VS Code · " + ide.folders.map((f) => f.split(/[\\/]/).filter(Boolean).pop()).join(", "), color: P.vscode, detail: ide, order: 2 }
                 : { id: "hub:vscode", label: "VS Code", color: P.vscode, order: 2 };
    }
    const o = SURFACE_ORDER.indexOf(s.surface);
    return { id: "hub:" + s.surface, label: s.surface, color: surfaceColor(s.surface), order: o < 0 ? 3 : o };
  };
  const groups = new Map();
  for (const s of roots) {
    const h = hubOf(s);
    if (!groups.has(h.id)) groups.set(h.id, { hub: h, sessions: [] });
    groups.get(h.id).sessions.push(s);
  }
  const hubList = [...groups.values()].sort((a, b) => a.hub.order - b.hub.order || a.hub.label.localeCompare(b.hub.label));
  for (const g of hubList) {
    g.sessions.sort((a, b) => a.name.localeCompare(b.name) || a.id.localeCompare(b.id));
    const ordered = [];
    const visit = (s) => { ordered.push(s); childrenOf.get(s.id).forEach(visit); };
    g.sessions.forEach(visit);
    g.sessions = ordered;
  }
  sessions.splice(0, sessions.length, ...hubList.flatMap((g) => g.sessions));

  // Data edges per session, collected first so sinks can be laid out.
  const sinkSet = new Map(); const edges = [];
  for (const s of sessions) {
    const agentKey = (aid) => aid && s.subagents.some((a) => a.id === aid) ? "a:" + s.id + ":" + aid : "s:" + s.id;
    const m = new Map();
    const add = (sink, src, live, at, w = 1) => {
      const k = src + "→" + sink, e = m.get(k) || { sink, src, live: false, at: 0, w: 0 };

    };

  fetch("state").then((r) => r.json()).then(build).finally(connect);
}
</script>
