    .calendar {

    }

      content: ""; position: absolute; height: 10px; bottom: -9px; left: -1px; right: -1px;

    .ring { width: 12px; height: 28px; margin-top: -10px; border: 3px solid var(--cp-border-strong); border-radius: 8px; background: var(--cp-bg); }
    .page { text-align: center; }
    .eyebrow { margin: 24px 0 0; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--cp-text-muted); }
    .day {
      display: block; font-size: clamp(112px, 32vw, 184px); font-weight: 300;
      line-height: 1.12; letter-spacing: -.075em; padding-right: .075em;
      font-variant-numeric: lining-nums tabular-nums; color: var(--cp-accent);
    }

    blockquote { margin: 0; font-size: clamp(20px, 5vw, 26px); line-height: 1.5; font-weight: 400; letter-spacing: -.02em; min-height: 116px; display: grid; place-items: center; }
    .footnote { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--cp-text-muted); margin-top: 24px; }
    nav { display: flex; gap: 12px; align-items: center; justify-content: center; }
    button, select {
      font: inherit; border-radius: .625rem; border: 1px solid var(--cp-border);

    button:hover { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
    button:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 4px; }

    .arrow { width: 48px; font-size: 22px; padding: 4px; }
    .hint { text-align: center; font-size: 12px; line-height: 1.6; color: var(--cp-text-muted); margin: 20px 0; }
    details { text-align: center; margin-top: 20px; }
    summary { cursor: pointer; font-size: 12px; color: var(--cp-text-muted); padding: 8px; list-style-position: inside; }
    .picker { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 12px; }

<body>
  <main>
    <header class="masthead">
      <h1>The Daily Letdown</h1>
      <span class="edition">LOW EXPECTATIONS EDITION</span>
    </header>
    <article class="calendar" aria-label="Daily demotivational calendar">
      <div class="binding" aria-hidden="true"><span class="ring"></span><span class="ring"></span></div>
      <div class="page" id="page" aria-live="polite" aria-atomic="true">
        <p class="eyebrow">A fresh day. Same ambition.</p>
        <div aria-label="Date"><span class="day" id="day"></span><span class="month" id="month"></span></div>
        <div class="divider" aria-hidden="true"></div>
        <blockquote id="quote"></blockquote>
        <p class="footnote">One day at a time. Unfortunately.</p>
      </div>
    </article>
    <nav aria-label="Calendar navigation">
      <button class="arrow" id="previous" aria-label="Previous day" title="Previous day (Left arrow)">&#8592;</button>
      <button id="today">Today</button>
      <button class="arrow" id="next" aria-label="Next day" title="Next day (Right arrow)">&#8594;</button>
    </nav>
    <details>
      <summary>Skip to another disappointment</summary>
      <div class="picker">
        <label>Month<select id="choose-month"></select></label>
        <label>Day<select id="choose-day"></select></label>
      </div>
    </details>
    <p class="hint">A little less inspiration, every single day.<br>No year. No pressure. No remarkable progress.</p>
    <noscript>This calendar needs JavaScript to display the daily quote.</noscript>
  </main>

    "Your festive masterpiece has a price sticker attached.",
    "Even the wrapping paper has achieved closure.",
    "A day of leftovers and leftover responsibilities.",
    "Your sense of time is between snacks.",
    "The grand reflection is mostly looking for receipts.",
    "Your highlights fit comfortably on a sticky note.",
    "A final chance to label the folder Final Final.",
    "Tomorrow: a fresh start for the same unfinished list."
  ]
]
  </script>
  <script id="calendar-app">
    (() => {
      const quotes = JSON.parse(document.getElementById("quotes").textContent);
      const months = ["January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"];
      const monthSelect = document.getElementById("choose-month");
      const daySelect = document.getElementById("choose-day");
      const page = document.getElementById("page");
      let month, day, followingToday = true, midnightTimer;
      const localToday = () => { const date = new Date(); return [date.getMonth(), date.getDate()]; };
      months.forEach((name, index) => monthSelect.add(new Option(name, String(index))));

      function render(animate = true) {
        document.getElementById("day").textContent = String(day).padStart(2, "0");
        document.getElementById("month").textContent = months[month];
        document.getElementById("quote").textContent = quotes[month][day - 1];
        monthSelect.value = String(month);
        daySelect.replaceChildren();
        for (let value = 1; value <= quotes[month].length; value++) {
          daySelect.add(new Option(String(value), String(value)));
        }
        daySelect.value = String(day);
        const [todayMonth, todayDay] = localToday();
        followingToday = month === todayMonth && day === todayDay;
        document.getElementById("today").setAttribute("aria-pressed", String(followingToday));
        if (animate) {
          page.classList.remove("turn");
          void page.offsetWidth;
          page.classList.add("turn");
        }
      }
      function goToday() {
        [month, day] = localToday();
        render();
      }
      function step(direction) {
        day += direction;
        if (day > quotes[month].length) { month = (month + 1) % 12; day = 1; }
        if (day < 1) { month = (month + 11) % 12; day = quotes[month].length; }
        render();
      }
      document.getElementById("previous").addEventListener("click", () => step(-1));
      document.getElementById("next").addEventListener("click", () => step(1));
      document.getElementById("today").addEventListener("click", goToday);
      monthSelect.addEventListener("change", () => {
        month = Number(monthSelect.value);
        day = Math.min(day, quotes[month].length);
        render();
      });
      daySelect.addEventListener("change", () => {
        day = Number(daySelect.value);
        render();
      });
      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
            event.target.closest("select, input, textarea, [contenteditable]")) return;
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          step(event.key === "ArrowLeft" ? -1 : 1);
        }
      });
      function scheduleMidnight() {
        clearTimeout(midnightTimer);
        const now = new Date();
        const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        midnightTimer = setTimeout(() => {
          if (followingToday) goToday();
          scheduleMidnight();
        }, next.getTime() - now.getTime() + 100);
      }
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          if (followingToday) goToday();
          scheduleMidnight();
        }
      });
      const media = matchMedia("(prefers-color-scheme: dark)");
      function syncTheme() {
        const hostMode = document.documentElement.getAttribute("data-color-mode");
        const theme = hostMode === "dark" || hostMode === "light" ? hostMode :
          new URLSearchParams(location.search).get("scoutTheme") || (media.matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      }
      new MutationObserver(syncTheme).observe(document.documentElement, {
        attributes: true, attributeFilter: ["data-color-mode"]
      });
      media.addEventListener("change", syncTheme);
      syncTheme();
      goToday();
      scheduleMidnight();
    })();
  </script>
