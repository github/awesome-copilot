                - heading ".NET Upgrade Collection" [level=1] [ref=f5e89]
                - paragraph [ref=f5e90]: .NET Framework upgrade specialist for comprehensive project migration
                - paragraph [ref=f5e91]:
                  - strong [ref=f5e92]: "Tags:"
                  - text: dotnet, upgrade, migration, framework, modernization
                - heading "Collection Usage" [level=2] [ref=f5e93]
                - heading ".NET Upgrade Chat Mode" [level=3] [ref=f5e94]
                - paragraph [ref=f5e95]: Discover and plan your .NET upgrade journey!
                - code [ref=f5e97]: "--- mode: dotnet-upgrade title: Analyze current .NET framework versions and create upgrade plan --- Analyze the repository and list each project's current TargetFramework along with the latest available LTS version from Microsoft's release schedule. Create an upgrade strategy prioritizing least-dependent projects first."
                - paragraph [ref=f5e98]: The upgrade chat mode automatically adapts to your repository's current .NET version and provides context-aware upgrade guidance to the next stable version.
                - paragraph [ref=f5e99]: "It will help you:"
                - list [ref=f5e100]:
                  - listitem [ref=f5e101]: Auto-detect current .NET versions across all projects
                  - listitem [ref=f5e102]: Generate optimal upgrade sequences
                  - listitem [ref=f5e103]: Identify breaking changes and modernization opportunities
                  - listitem [ref=f5e104]: Create per-project upgrade flows
                - separator [ref=f5e105]
                - heading ".NET Upgrade Instructions" [level=3] [ref=f5e106]
                - paragraph [ref=f5e107]: Execute comprehensive .NET framework upgrades with structured guidance!
                - paragraph [ref=f5e108]: "The instructions provide:"
                - list [ref=f5e109]:
                  - listitem [ref=f5e110]: Sequential upgrade strategies
                  - listitem [ref=f5e111]: Dependency analysis and sequencing
                  - listitem [ref=f5e112]: Framework targeting and code adjustments
                  - listitem [ref=f5e113]: NuGet and dependency management
                  - listitem [ref=f5e114]: CI/CD pipeline updates
                  - listitem [ref=f5e115]: Testing and validation procedures
                - paragraph [ref=f5e116]: Use these instructions when implementing upgrade plans to ensure proper execution and validation.
                - separator [ref=f5e117]
                - heading ".NET Upgrade Prompts" [level=3] [ref=f5e118]
                - paragraph [ref=f5e119]: Quick access to specialized upgrade analysis prompts!
                - paragraph [ref=f5e120]: "The prompts collection includes ready-to-use queries for:"
                - list [ref=f5e121]:
                  - listitem [ref=f5e122]: Project discovery and assessment
                  - listitem [ref=f5e123]: Upgrade strategy and sequencing
                  - listitem [ref=f5e124]: Framework targeting and code adjustments
                  - listitem [ref=f5e125]: Breaking change analysis
                  - listitem [ref=f5e126]: CI/CD pipeline updates
                  - listitem [ref=f5e127]: Final validation and delivery
                - paragraph [ref=f5e128]: Use these prompts for targeted analysis of specific upgrade aspects.
                - separator [ref=f5e129]
                - heading "Quick Start" [level=2] [ref=f5e130]
                - list [ref=f5e131]:
                  - listitem [ref=f5e132]:
                    - text: Run a discovery pass to enumerate all
                    - code [ref=f5e133]: "*.sln"
                    - text: and
                    - code [ref=f5e134]: "*.csproj"
                    - text: files in the repository.
                  - listitem [ref=f5e135]: Detect the current .NET version(s) used across projects.
                  - listitem [ref=f5e136]:
                    - text: Identify the latest available stable .NET version (LTS preferred) — usually
                    - code [ref=f5e137]: "+2"
                    - text: years ahead of the existing version.
                  - listitem [ref=f5e138]:
                    - text: Generate an upgrade plan to move from current → next stable version (e.g.,
                    - code [ref=f5e139]: net6.0 → net8.0
                    - text: ", or"
                    - code [ref=f5e140]: net7.0 → net9.0
                    - text: ).
                  - listitem [ref=f5e141]: Upgrade one project at a time, validate builds, update tests, and modify CI/CD accordingly.
                - separator [ref=f5e142]
                - heading "Auto-Detect Current .NET Version" [level=2] [ref=f5e143]
                - paragraph [ref=f5e144]: "To automatically detect the current framework versions across the solution:"
                - code [ref=f5e146]: "# 1. Check global SDKs installed dotnet --list-sdks # 2. Detect project-level TargetFrameworks find . -name \"*.csproj\" -exec grep -H \"<TargetFramework\" {} \\; # 3. Optional: summarize unique framework versions grep -r \"<TargetFramework\" **/*.csproj | sed 's/.*<TargetFramework>//;s/<\\/TargetFramework>//' | sort | uniq # 4. Verify runtime environment dotnet --info | grep \"Version\""
                - paragraph [ref=f5e147]:
                  - strong [ref=f5e148]: "Chat Prompt:"
                - blockquote [ref=f5e149]:
                  - paragraph [ref=f5e150]: "\"Analyze the repository and list each project’s current TargetFramework along with the latest available LTS version from Microsoft’s release schedule.\""
                - separator [ref=f5e151]
                - heading "Discovery & Analysis Commands" [level=2] [ref=f5e152]
                - code [ref=f5e154]: "# List all projects dotnet sln list # Check current target frameworks for each project grep -H \"TargetFramework\" **/*.csproj # Check outdated packages dotnet list <ProjectName>.csproj package --outdated # Generate dependency graph dotnet msbuild <ProjectName>.csproj /t:GenerateRestoreGraphFile /p:RestoreGraphOutputPath=graph.json"
                - paragraph [ref=f5e155]:
                  - strong [ref=f5e156]: "Chat Prompt:"
                - blockquote [ref=f5e157]:
                  - paragraph [ref=f5e158]: "\"Analyze the solution and summarize each project’s current TargetFramework and suggest the appropriate next LTS upgrade version.\""
                - separator [ref=f5e159]
                - heading "Classification Rules" [level=2] [ref=f5e160]
                - list [ref=f5e161]:
                  - listitem [ref=f5e162]:
                    - code [ref=f5e163]: TargetFramework
                    - text: starts with
                    - code [ref=f5e164]: netcoreapp
                    - text: ","
                    - code [ref=f5e165]: net5.0+
                    - text: ","
                    - code [ref=f5e166]: net6.0+
                    - text: ", etc. →"
                    - strong [ref=f5e167]: Modern .NET
                  - listitem [ref=f5e168]:
                    - code [ref=f5e169]: netstandard*
                    - text: →
                    - strong [ref=f5e170]: .NET Standard
                    - text: (migrate to current .NET version)
                  - listitem [ref=f5e171]:
                    - code [ref=f5e172]: net4*
                    - text: →
                    - strong [ref=f5e173]: .NET Framework
                    - text: (migrate via intermediate step to .NET 8+)
                - separator [ref=f5e174]
                - heading "Upgrade Sequence" [level=2] [ref=f5e175]
                - list [ref=f5e176]:
                  - listitem [ref=f5e177]:
                    - strong [ref=f5e178]: "Start with Independent Libraries:"
                    - text: Least dependent class libraries first.
                  - listitem [ref=f5e179]:
                    - strong [ref=f5e180]: "Next:"
                    - text: Shared components and common utilities.
                  - listitem [ref=f5e181]:
                    - strong [ref=f5e182]: "Then:"
                    - text: API, Web, or Function projects.
                  - listitem [ref=f5e183]:
                    - strong [ref=f5e184]: "Finally:"
                    - text: Tests, integration points, and pipelines.
                - paragraph [ref=f5e185]:
                  - strong [ref=f5e186]: "Chat Prompt:"
                - blockquote [ref=f5e187]:
                  - paragraph [ref=f5e188]: "\"Generate the optimal upgrade order for this repository, prioritizing least-dependent projects first.\""
                - separator [ref=f5e189]
                - heading "Per-Project Upgrade Flow" [level=2] [ref=f5e190]
                - list [ref=f5e191]:
                  - listitem [ref=f5e192]:
                    - strong [ref=f5e193]: "Create branch:"
                    - code [ref=f5e194]: upgrade/<project>-to-<targetVersion>
                  - listitem [ref=f5e195]:
                    - strong [ref=f5e196]:
                      - text: Edit
                      - code [ref=f5e197]: <TargetFramework>
                    - text: in
