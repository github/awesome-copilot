                    - text: )
                  - listitem [ref=f5e200]:
                    - strong [ref=f5e201]: "Restore & update packages:"
                    - code [ref=f5e203]: dotnet restore dotnet list package --outdated dotnet add package <PackageName> --version <LatestVersion>
                  - listitem [ref=f5e204]:
                    - strong [ref=f5e205]: "Build & test:"
                    - code [ref=f5e207]: dotnet build <ProjectName>.csproj dotnet test <ProjectName>.Tests.csproj
                  - listitem [ref=f5e208]:
                    - strong [ref=f5e209]: Fix issues
