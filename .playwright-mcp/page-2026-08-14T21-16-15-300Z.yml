                - heading ".NET Upgrade Collection" [level=1] [ref=f2e89]
                - paragraph [ref=f2e90]: .NET Framework upgrade specialist for comprehensive project migration
                - paragraph [ref=f2e91]:
                  - strong [ref=f2e92]: "Tags:"
                  - text: dotnet, upgrade, migration, framework, modernization
                - heading "Collection Usage" [level=2] [ref=f2e93]
                - heading ".NET Upgrade Chat Mode" [level=3] [ref=f2e94]
                - paragraph [ref=f2e95]: Discover and plan your .NET upgrade journey!
                - code [ref=f2e97]: "--- mode: dotnet-upgrade title: Analyze current .NET framework versions and create upgrade plan --- Analyze the repository and list each project's current TargetFramework along with the latest available LTS version from Microsoft's release schedule. Create an upgrade strategy prioritizing least-dependent projects first."
                - paragraph [ref=f2e98]: The upgrade chat mode automatically adapts to your repository's current .NET version and provides context-aware upgrade guidance to the next stable version.
                - paragraph [ref=f2e99]: "It will help you:"
                - list [ref=f2e100]:
                  - listitem [ref=f2e101]: Auto-detect current .NET versions across all projects
                  - listitem [ref=f2e102]: Generate optimal upgrade sequences
                  - listitem [ref=f2e103]: Identify breaking changes and modernization opportunities
                  - listitem [ref=f2e104]: Create per-project upgrade flows
                - separator [ref=f2e105]
                - heading ".NET Upgrade Instructions" [level=3] [ref=f2e106]
                - paragraph [ref=f2e107]: Execute comprehensive .NET framework upgrades with structured guidance!
                - paragraph [ref=f2e108]: "The instructions provide:"
                - list [ref=f2e109]:
                  - listitem [ref=f2e110]: Sequential upgrade strategies
                  - listitem [ref=f2e111]: Dependency analysis and sequencing
                  - listitem [ref=f2e112]: Framework targeting and code adjustments
                  - listitem [ref=f2e113]: NuGet and dependency management
                  - listitem [ref=f2e114]: CI/CD pipeline updates
                  - listitem [ref=f2e115]: Testing and validation procedures
                - paragraph [ref=f2e116]: Use these instructions when implementing upgrade plans to ensure proper execution and validation.
                - separator [ref=f2e117]
                - heading ".NET Upgrade Prompts" [level=3] [ref=f2e118]
                - paragraph [ref=f2e119]: Quick access to specialized upgrade analysis prompts!
                - paragraph [ref=f2e120]: "The prompts collection includes ready-to-use queries for:"
                - list [ref=f2e121]:
                  - listitem [ref=f2e122]: Project discovery and assessment
                  - listitem [ref=f2e123]: Upgrade strategy and sequencing
                  - listitem [ref=f2e124]: Framework targeting and code adjustments
                  - listitem [ref=f2e125]: Breaking change analysis
                  - listitem [ref=f2e126]: CI/CD pipeline updates
                  - listitem [ref=f2e127]: Final validation and delivery
                - paragraph [ref=f2e128]: Use these prompts for targeted analysis of specific upgrade aspects.
                - separator [ref=f2e129]
                - heading "Quick Start" [level=2] [ref=f2e130]
                - list [ref=f2e131]:
                  - listitem [ref=f2e132]:
                    - text: Run a discovery pass to enumerate all
                    - code [ref=f2e133]: "*.sln"
                    - text: and
                    - code [ref=f2e134]: "*.csproj"
                    - text: files in the repository.
                  - listitem [ref=f2e135]: Detect the current .NET version(s) used across projects.
                  - listitem [ref=f2e136]:
                    - text: Identify the latest available stable .NET version (LTS preferred) — usually
                    - code [ref=f2e137]: "+2"
                    - text: years ahead of the existing version.
                  - listitem [ref=f2e138]:
                    - text: Generate an upgrade plan to move from current → next stable version (e.g.,
                    - code [ref=f2e139]: net6.0 → net8.0
                    - text: ", or"
                    - code [ref=f2e140]: net7.0 → net9.0
                    - text: ).
                  - listitem [ref=f2e141]: Upgrade one project at a time, validate builds, update tests, and modify CI/CD accordingly.
                - separator [ref=f2e142]
                - heading "Auto-Detect Current .NET Version" [level=2] [ref=f2e143]
                - paragraph [ref=f2e144]: "To automatically detect the current framework versions across the solution:"
                - code [ref=f2e146]: "# 1. Check global SDKs installed dotnet --list-sdks # 2. Detect project-level TargetFrameworks find . -name \"*.csproj\" -exec grep -H \"<TargetFramework\" {} \\; # 3. Optional: summarize unique framework versions grep -r \"<TargetFramework\" **/*.csproj | sed 's/.*<TargetFramework>//;s/<\\/TargetFramework>//' | sort | uniq # 4. Verify runtime environment dotnet --info | grep \"Version\""
                - paragraph [ref=f2e147]:
                  - strong [ref=f2e148]: "Chat Prompt:"
                - blockquote [ref=f2e149]:
                  - paragraph [ref=f2e150]: "\"Analyze the repository and list each project’s current TargetFramework along with the latest available LTS version from Microsoft’s release schedule.\""
                - separator [ref=f2e151]
                - heading "Discovery & Analysis Commands" [level=2] [ref=f2e152]
                - code [ref=f2e154]: "# List all projects dotnet sln list # Check current target frameworks for each project grep -H \"TargetFramework\" **/*.csproj # Check outdated packages dotnet list <ProjectName>.csproj package --outdated # Generate dependency graph dotnet msbuild <ProjectName>.csproj /t:GenerateRestoreGraphFile /p:RestoreGraphOutputPath=graph.json"
                - paragraph [ref=f2e155]:
                  - strong [ref=f2e156]: "Chat Prompt:"
                - blockquote [ref=f2e157]:
                  - paragraph [ref=f2e158]: "\"Analyze the solution and summarize each project’s current TargetFramework and suggest the appropriate next LTS upgrade version.\""
                - separator [ref=f2e159]
                - heading "Classification Rules" [level=2] [ref=f2e160]
                - list [ref=f2e161]:
                  - listitem [ref=f2e162]:
                    - code [ref=f2e163]: TargetFramework
                    - text: starts with
                    - code [ref=f2e164]: netcoreapp
                    - text: ","
                    - code [ref=f2e165]: net5.0+
                    - text: ","
                    - code [ref=f2e166]: net6.0+
                    - text: ", etc. →"
                    - strong [ref=f2e167]: Modern .NET
                  - listitem [ref=f2e168]:
                    - code [ref=f2e169]: netstandard*
                    - text: →
                    - strong [ref=f2e170]: .NET Standard
                    - text: (migrate to current .NET version)
                  - listitem [ref=f2e171]:
                    - code [ref=f2e172]: net4*
                    - text: →
                    - strong [ref=f2e173]: .NET Framework
                    - text: (migrate via intermediate step to .NET 8+)
                - separator [ref=f2e174]
                - heading "Upgrade Sequence" [level=2] [ref=f2e175]
                - list [ref=f2e176]:
                  - listitem [ref=f2e177]:
                    - strong [ref=f2e178]: "Start with Independent Libraries:"
                    - text: Least dependent class libraries first.
                  - listitem [ref=f2e179]:
                    - strong [ref=f2e180]: "Next:"
                    - text: Shared components and common utilities.
                  - listitem [ref=f2e181]:
                    - strong [ref=f2e182]: "Then:"
                    - text: API, Web, or Function projects.
                  - listitem [ref=f2e183]:
                    - strong [ref=f2e184]: "Finally:"
                    - text: Tests, integration points, and pipelines.
                - paragraph [ref=f2e185]:
                  - strong [ref=f2e186]: "Chat Prompt:"
                - blockquote [ref=f2e187]:
                  - paragraph [ref=f2e188]: "\"Generate the optimal upgrade order for this repository, prioritizing least-dependent projects first.\""
