<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Agent Radar</title>
<link rel="icon" href="data:," />
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--background-color-default, #0d1117);
    color: var(--text-color-default, #e6edf3);
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
    font-size: var(--text-body-small, 12px);
    display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto minmax(0, 1fr) var(--feedH, 36vh); height: 100vh;
  }
  header {
    grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 8px 12px;
    border-bottom: 1px solid var(--border-color-default, #30363d);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: var(--font-weight-semibold, 600); letter-spacing: .02em; }
  header .stat { color: var(--text-color-muted, #8b949e); }
  header .stat b { color: var(--text-color-default, #e6edf3); }
  header label { margin-left: auto; color: var(--text-color-muted, #8b949e); cursor: pointer; user-select: none; }
  header .live { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 8px #3fb950; animation: blink 1.6s infinite; }
  header .live.off { background: #f85149; box-shadow: 0 0 8px #f85149; }
  @keyframes blink { 50% { opacity: .35; } }
  #stage { position: relative; min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; }
  canvas { width: 100%; display: block; }
  #legend { position: sticky; bottom: 0; margin-top: -28px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 10px; color: var(--text-color-muted, #8b949e); pointer-events: none;
    background: color-mix(in srgb, var(--background-color-default, #0d1117) 85%, transparent); }
  #legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  #tip { position: absolute; pointer-events: none; max-width: 360px; padding: 8px 10px; border-radius: 8px; display: none;
    background: color-mix(in srgb, var(--background-color-default, #0d1117) 92%, transparent);
    border: 1px solid var(--border-color-default, #30363d); box-shadow: 0 8px 24px rgba(0,0,0,.35); line-height: 1.45; z-index: 3; }
  #tip .t { font-weight: 600; margin-bottom: 2px; }
  #tip .m { color: var(--text-color-muted, #8b949e); }
  aside { border-left: 1px solid var(--border-color-default, #30363d); overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; }
  #list { overflow-y: auto; padding: 8px; min-height: 0; }
  .card { border: 1px solid var(--border-color-default, #30363d); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
  .card:hover, .card.sel { border-color: var(--c, #8957e5); background: color-mix(in srgb, var(--c, #8957e5) 8%, transparent); }
  .card .row { display: flex; align-items: center; gap: 6px; }
  .card .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .card .meta { color: var(--text-color-muted, #8b949e); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .doing { margin-top: 5px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub { margin: 3px 0 0 10px; color: var(--text-color-muted, #8b949e); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub b { color: var(--text-color-default, #e6edf3); font-weight: 500; }
  .card:focus-visible { outline: 2px solid var(--c, #8957e5); outline-offset: 1px; }
  .card.dest { padding: 6px 10px; }
  .card.dest .name { color: var(--text-color-default, #e6edf3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #6e7681; }
  .dot.busy { background: #3fb950; box-shadow: 0 0 6px #3fb950; animation: blink 1s infinite; }
  .dot.wait { background: #d29922; box-shadow: 0 0 6px #d29922; animation: blink .6s infinite; }
  .pill { font-size: 10px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--c); color: var(--text-color-default, #e6edf3); flex: none; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-color-muted, #8b949e); margin: 6px 2px 8px; font-weight: 600; }
  #feedWrap { grid-column: 1 / 3; border-top: 1px solid var(--border-color-default, #30363d); display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); min-height: 0; position: relative; }
  #models { grid-column: 2; grid-row: 1 / 3; border-left: 1px solid var(--border-color-default, #30363d); overflow-y: auto; padding: 0 10px 8px; min-height: 0; }
  #models h2 { margin: 7px 0; }
  .mdl { border: 1px solid var(--border-color-default, #30363d); border-left: 3px solid var(--c); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
  .mdl .top { display: flex; align-items: baseline; gap: 6px; }
  .mdl .nm { font-weight: 600; color: var(--text-color-default, #e6edf3); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mdl.idle { opacity: .55; }
  .mdl .act { color: #3fb950; font-size: 10px; animation: blink 1.6s infinite; }
  .mdl .ago { color: var(--text-color-muted, #8b949e); font-size: 10px; }
  .mdl .rate { font-variant-numeric: tabular-nums; font-weight: 600; }
  .mdl .nums { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 0 10px; margin-top: 3px; font-variant-numeric: tabular-nums; color: var(--text-color-muted, #8b949e); }
  .mdl .nums b { color: var(--text-color-default, #e6edf3); font-weight: 500; text-align: right; }
  .mdl .nums span { text-align: right; }
  .mdl .bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 5px; background: color-mix(in srgb, var(--c) 15%, transparent); }
  .mdl .bar i { display: block; height: 100%; }
  .mdl .who { margin-top: 3px; color: var(--text-color-muted, #8b949e); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #feedHead { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
  #feedHead h2 { margin: 7px 0; }
  #feedHead .hint { color: var(--text-color-muted, #8b949e); }
  #grip { position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; z-index: 4; }
  #feed { overflow: auto; min-height: 0; }
  #feed table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #feed th { position: sticky; top: 0; text-align: left; font-weight: 600; color: var(--text-color-muted, #8b949e); padding: 3px 8px; font-size: 11px;
    background: var(--background-color-default, #0d1117); border-bottom: 1px solid var(--border-color-default, #30363d); }
  #feed td { padding: 3px 8px; border-bottom: 1px dashed color-mix(in srgb, var(--border-color-default, #30363d) 55%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  #feed tr.live td { background: color-mix(in srgb, #3fb950 7%, transparent); }
  #feed tr.fail .dest::after { content: " ✗"; color: #f85149; }
  #feed .ts { color: var(--text-color-muted, #8b949e); font-variant-numeric: tabular-nums; }
  #feed .dest { color: var(--text-color-default, #e6edf3); font-weight: 600; }
  #feed .dest::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  #feed .agent { color: var(--text-color-muted, #8b949e); }
  #feed .cmd { font-family: var(--font-mono, ui-monospace, monospace); font-size: 11px; white-space: pre-wrap; word-break: break-all; overflow: visible; }
  #feed .cmd div { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #feed tr.peer .cmd { white-space: nowrap; overflow: hidden; }
  .empty { color: var(--text-color-muted, #8b949e); padding: 20px 6px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="live" id="live"></div>
  <h1>Agent Radar</h1>
  <span class="stat"><b id="sBusy">0</b> working</span>
  <span class="stat"><b id="sWait">0</b> waiting on you</span>
  <span class="stat"><b id="sSub">0</b> sub-agents</span>
  <span class="stat"><b id="sAll">0</b> sessions</span>
  <span class="stat"><b id="sFlow">0</b> flows / 2 min</span>
  <label><input type="checkbox" id="showIdle" /> show idle</label>
</header>
<div id="stage">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="tip"></div>
  <div id="legend"></div>
</div>
<aside>
  <div id="list" aria-label="Agents and data destinations"></div>
</aside>
<section id="feedWrap">
  <div id="grip" title="Drag to resize"></div>
  <div id="feedHead"><h2>Data flow feed</h2><span class="hint" id="feedCount"></span></div>
  <div id="feed"></div>
  <div id="models"></div>
</section>
<script>
const SURFACE_COLORS = { "Copilot app": "#a371f7", "VS Code agent": "#2f81f7", "Copilot CLI": "#f778ba" };
const surfaceColor = (s) => SURFACE_COLORS[s] || (/chat$/.test(s) ? "#39c5cf" : "#8b949e");
const SINK_COLORS = {
  "GitHub": "#e6edf3", "Git": "#f0883e", "Web": "#58a6ff", "Shell": "#7ee787", "Build / run": "#56d364",
  "Filesystem": "#d2a8ff", "SSH hosts": "#ffdf5d", "Containers": "#1f9bf0",
  "You": "#d29922", "Session DB": "#8b949e", "Copilot Memory": "#bc8cff", "Memory (local)": "#bc8cff",
};
// MCP servers and CLIs get a stable color from a hash of the name.
const hashColor = (s) => {
  let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) | 0;
  const hue = ((h % 360) + 360) % 360, sat = .7, lit = .65, a = sat * Math.min(lit, 1 - lit);
  const f = (n) => { const k = (n + hue / 30) % 12; return Math.round(255 * (lit - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, "0"); };
  return "#" + f(0) + f(8) + f(4);
};
const sinkColor = (s) => s.startsWith("LLM:") ? "#f2cc60" : (SINK_COLORS[s] || hashColor(s));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = (t) => { if (!t) return ""; const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? `${s | 0}s` : s < 3600 ? `${(s / 60) | 0}m` : `${(s / 3600) | 0}h`; };

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip"), stage = document.getElementById("stage");
// The canvas is as high as the visible stage, or higher when the rows need more space.
// Then the stage scrolls, so that all rows stay readable.
let W = 0, H = 0, DPR = 1, contentH = 0;
function resize() {
  DPR = window.devicePixelRatio || 1;
  const w = stage.clientWidth, h = Math.max(stage.clientHeight, contentH);
  if (w === W && h === H && cv.width === Math.round(w * DPR)) return;
  W = w; H = h; cv.style.height = H + "px"; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
resize();

// ---------- Layout model (fixed columns, stable rows) ----------
const nodes = new Map();
let links = [], particles = [], snapshot = null, selected = null, hover = null;
const LOCAL_SINKS = new Set(["Filesystem", "Shell", "Build / run", "Session DB", "Containers", "You", "Memory (local)"]);
const sinkGroup = (s) => s.startsWith("LLM:") ? 0 : LOCAL_SINKS.has(s) ? 1 : 2;
const GROUP_NAMES = ["MODELS", "LOCAL MACHINE", "TOOLS & SERVICES"];
const SURFACE_ORDER = ["Copilot app", "Copilot CLI", "VS Code agent"];
let headers = [], groupLabels = [];
// Honor the system setting to reduce motion: no particles, pulse rings, easing, or smooth scrolling.
const motionQuery = matchMedia("(prefers-reduced-motion: reduce)");
let reduceMotion = motionQuery.matches;
motionQuery.addEventListener("change", (e) => { reduceMotion = e.matches; if (reduceMotion) particles = []; });

function upsert(id, props) {
  let n = nodes.get(id);
  if (!n) { n = { id, x: props.tx, y: props.ty, born: performance.now() }; nodes.set(id, n); }
  Object.assign(n, props, { seen: true });
  return n;
}

function build(snap) {
  if (!snap?.sessions) return;
  snapshot = snap;
  const showIdle = document.getElementById("showIdle").checked;
  const now = snap.now;
  for (const n of nodes.values()) n.seen = false;
  links = [];
  const L = (a, b, o = {}) => links.push({ a, b, ...o });

  const sessions = snap.sessions.filter((s) => showIdle || s.busy || s.waiting)
    .map((s) => showIdle ? s : { ...s, subagents: s.subagents.filter((a) => a.running) });

  // Assign each session to a hub (surface, or the VS Code window it lives in).
  const normPath = (p) => { let n = String(p || "").replace(/\\/g, "/").replace(/\/+$/, ""); return /^[A-Za-z]:(\/|$)/.test(n) ? n.toLowerCase() : n; };
  const inFolder = (cwd, folder) => { const c = normPath(cwd), f = normPath(folder); return !!c && !!f && (c === f || c.startsWith(f + "/")); };
  const hubOf = (s) => {
    if (s.kind === "vscode-chat" || s.surface === "VS Code agent") {
      const roots = (s.folders?.length ? s.folders : [s.cwd]).filter(Boolean);
      const ide = snap.ides.find((i) => roots.some((c) => i.folders.some((f) => inFolder(c, f))));
      return ide ? { id: "ide:" + ide.id, label: "VS Code · " + ide.folders.map((f) => f.split(/[\\/]/).filter(Boolean).pop()).join(", "), color: "#2f81f7", detail: ide, order: 2 }
                 : { id: "hub:vscode", label: "VS Code", color: "#2f81f7", order: 2 };
    }
    const o = SURFACE_ORDER.indexOf(s.surface);
    return { id: "hub:" + s.surface, label: s.surface, color: surfaceColor(s.surface), order: o < 0 ? 3 : o };
  };
  const groups = new Map();
  for (const s of sessions) {
    const h = hubOf(s);
    if (!groups.has(h.id)) groups.set(h.id, { hub: h, sessions: [] });
    groups.get(h.id).sessions.push(s);
  }
  const hubList = [...groups.values()].sort((a, b) => a.hub.order - b.hub.order || a.hub.label.localeCompare(b.hub.label));
  for (const g of hubList) g.sessions.sort((a, b) => a.name.localeCompare(b.name) || a.id.localeCompare(b.id));

  // Data edges per session, collected first so sinks can be laid out.
  const sinkSet = new Map(); const edges = [];
  for (const s of sessions) {
    const agentKey = (aid) => aid && s.subagents.some((a) => a.id === aid) ? "a:" + s.id + ":" + aid : "s:" + s.id;
    const m = new Map();
    const add = (sink, src, live, at, w = 1) => {
      const k = src + "→" + sink, e = m.get(k) || { sink, src, live: false, at: 0, w: 0 };
      e.live ||= live; e.at = Math.max(e.at, at || 0); e.w += w; m.set(k, e);
    };
    for (const t of s.runningTools) if (t.sink) add(t.sink, agentKey(t.agentId), true, now);
    for (const f of s.flows) add(f.sink, agentKey(f.agentId), false, f.endAt, f.tokens ? Math.min(4, f.tokens / 20000) : 1);
    for (const e of m.values()) { edges.push(e); sinkSet.set(e.sink, (sinkSet.get(e.sink) || 0) + e.w); }
  }
  const sinks = [...sinkSet.keys()].sort((a, b) => sinkGroup(a) - sinkGroup(b) || a.localeCompare(b));

  // Vertical slots.
  let sessSlots = 0;
  for (const g of hubList) { for (const s of g.sessions) sessSlots += Math.max(1, s.subagents.length) + .4; sessSlots += .8; }
  let sinkSlots = sinks.length + new Set(sinks.map(sinkGroup)).size * .9;
  const total = Math.max(sessSlots, sinkSlots, 1);
  const top = 46, bottom = 34, MIN_SLOT = 22;
  contentH = top + bottom + total * MIN_SLOT;
  resize();
  const usable = H - top - bottom;
  const slot = Math.max(MIN_SLOT, Math.min(64, usable / total));
  const X = { you: 36, hub: Math.max(110, W * .14), sess: W * .30, agent: W * .56, sink: W - 30 };
  headers = [["SURFACE", X.hub], ["SESSIONS", X.sess], ["SUB-AGENTS", X.agent], ["DATA DESTINATIONS", X.sink, "right"]];

  let y = top + Math.max(0, (usable - sessSlots * slot) / 2) + slot / 2;
  const hubYs = [];
  for (const g of hubList) {
    const ys = [];
    for (const s of g.sessions) {
      const rows = Math.max(1, s.subagents.length);
      const sy = y + (rows - 1) * slot / 2;
      const sid = "s:" + s.id, color = surfaceColor(s.surface);
      upsert(sid, { type: "session", label: s.name, color, s, tx: X.sess, ty: sy, r: 7 });
      ys.push(sy);
      L(g.hub.id, sid, { color, kind: "own", active: s.busy });
      s.subagents.forEach((a, i) => {
        const aid = "a:" + s.id + ":" + a.id;
        upsert(aid, { type: "agent", label: a.name, color, a, parent: s, tx: X.agent, ty: y + i * slot, r: a.running ? 5 : 3.5 });
        L(sid, aid, { color, kind: "sub", active: a.running });
      });
      y += (rows + .4) * slot;
    }
    const hy = ys.reduce((a, b) => a + b, 0) / ys.length;
    upsert(g.hub.id, { type: "hub", label: g.hub.label, color: g.hub.color, detail: g.hub.detail, tx: X.hub, ty: hy, r: 10 });
    hubYs.push(hy);
    L("you", g.hub.id, { color: g.hub.color, kind: "hub" });
    y += .8 * slot;
  }
  upsert("you", { type: "you", label: "You", color: "#d29922", tx: X.you, ty: hubYs.length ? hubYs.reduce((a, b) => a + b, 0) / hubYs.length : top + usable / 2, r: 12 });

  groupLabels = [];
  let sy = top + Math.max(0, (usable - sinkSlots * slot) / 2) + slot / 2, lastG = -1;
  for (const k of sinks) {
    const g = sinkGroup(k);
    if (g !== lastG) { sy += .9 * slot * (lastG === -1 ? .6 : 1); groupLabels.push([GROUP_NAMES[g], sy - slot * .75]); lastG = g; }
    upsert("k:" + k, { type: "sink", label: k, color: sinkColor(k), tx: X.sink, ty: sy, r: 7 });
    sy += slot;
  }
  for (const e of edges) {
    const fresh = Math.max(0, 1 - (now - e.at) / 120e3);
    L(e.src, "k:" + e.sink, { color: sinkColor(e.sink), kind: "flow", active: e.live, heat: e.live ? 1 : fresh, w: e.w });
  }
  const ids = new Set(sessions.map((s) => "s:" + s.id));
  for (const s of sessions) for (const p of s.peers) {
    const pid = "s:" + p.to;
    if (!ids.has(pid) || pid === "s:" + s.id) continue;
    const fresh = Math.max(0, 1 - (now - p.at) / 300e3);
    L("s:" + s.id, pid, { color: p.kind === "spawn" ? "#a371f7" : "#f778ba", kind: "peer", dashed: p.kind === "spawn", heat: fresh, active: fresh > .6 });
  }

  for (const [id, n] of nodes) if (!n.seen) nodes.delete(id);
  links = links.filter((l) => nodes.has(l.a) && nodes.has(l.b));
  if (selected && !nodes.has(selected.id)) selected = null;
  if (hover && !nodes.has(hover.id)) { hover = null; tip.style.display = "none"; cv.style.cursor = "default"; }
  renderSidebar(snap, sessions);
}
new ResizeObserver(() => { resize(); build(snapshot); }).observe(stage);

// ---------- Geometry ----------
function curve(l) {
  const a = nodes.get(l.a), b = nodes.get(l.b);
  if (l.kind === "peer") { const off = 40 + Math.abs(b.y - a.y) * .25; return [a.x, a.y, a.x - off, a.y, b.x - off, b.y, b.x, b.y]; }
  const dx = (b.x - a.x) * .5;
  return [a.x, a.y, a.x + dx, a.y, b.x - dx, b.y, b.x, b.y];
}
function bez(c, u) {
  const v = 1 - u;
  return [v*v*v*c[0] + 3*v*v*u*c[2] + 3*v*u*u*c[4] + u*u*u*c[6], v*v*v*c[1] + 3*v*v*u*c[3] + 3*v*u*u*c[5] + u*u*u*c[7]];
}

// ---------- Particles (throttled per link) ----------
function spawnParticles(t) {
  if (reduceMotion) return;
  for (const l of links) {
    const heat = l.active ? 1 : (l.heat || 0);
    if (heat < .05) continue;
    if ((l.kind === "hub" || l.kind === "own" || l.kind === "sub") && !l.active) continue;
    const interval = l.kind === "flow" ? 700 / heat : l.kind === "peer" ? 1200 / heat : 1800;
    if (t < (l.nextAt || 0)) continue;
    l.nextAt = t + interval * (.7 + Math.random() * .6);
    const back = l.kind === "flow" && Math.random() < .4;
    particles.push({ l, p: 0, back, speed: .007, size: l.kind === "flow" ? 1.6 + Math.min(1.6, (l.w || 1) * .3) : 1.5 });
  }
  if (particles.length > 400) particles.splice(0, particles.length - 400);
}

// ---------- Render ----------
const css = getComputedStyle(document.body);
const cssv = (n, d) => css.getPropertyValue(n).trim() || d;
function label(text, x, y, align, font, color, max) {
  if (text.length > max) text = text.slice(0, max - 1) + "…";
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineWidth = 4; ctx.strokeStyle = cssv("--background-color-default", "#0d1117"); ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const text = cssv("--text-color-default", "#e6edf3"), muted = cssv("--text-color-muted", "#8b949e");
  const sans = cssv("--font-sans", "system-ui"), mono = cssv("--font-mono", "ui-monospace");
  const ease = reduceMotion ? 1 : .14;
  for (const n of nodes.values()) { n.x += (n.tx - n.x) * ease; n.y += (n.ty - n.y) * ease; }

  // Column headers + session row bands.
  for (const [h, x, al] of headers) label(h, x, 22, al || "center", `600 10px ${sans}`, muted, 40);
  for (const [g, y] of groupLabels) label(g, W - 30, y, "right", `600 9px ${sans}`, muted, 40);
  for (const n of nodes.values()) if (n.type === "session" && (n.s.busy || n.s.waiting)) {
    ctx.globalAlpha = .05; ctx.fillStyle = n.s.waiting ? "#d29922" : n.color;
    const rows = Math.max(1, n.s.subagents.length), h = rows * 30;
    ctx.fillRect(nodes.get("you") ? 0 : 0, n.y - h / 2 - 4, W, h + 8);
  }
  ctx.globalAlpha = 1;

  const focus = selected || hover, related = new Set();
  if (focus) {
    related.add(focus.id);
    // Follow the chain both ways: you→hub→session→agent→sink. From a destination, follow
    // only the upward chain, so that we see all the agents that send data to it.
    // You and hubs go down only when they were reached downward (or are selected), so that
    // the ancestors of a selected session do not show its sibling sessions.
    const fromSink = focus.type === "sink", below = new Set([focus.id]);
    const top = (id) => { const t = nodes.get(id).type; return t === "you" || t === "hub"; };
    let changed = true;
    while (changed) { changed = false; for (const l of links) {
      if (l.kind === "peer") continue;
      const down = !fromSink && related.has(l.a) && !related.has(l.b) && (below.has(l.a) || !top(l.a));
      const up = related.has(l.b) && !related.has(l.a) && (fromSink || nodes.get(l.b).type !== "sink");
      if (down) below.add(l.b);
      if (down || up) { related.add(l.a); related.add(l.b); changed = true; }
    } }
  }
  const inFocus = (l) => !focus || (related.has(l.a) && related.has(l.b));

  for (const l of links) {
    const c = l._c = curve(l);
    const heat = l.active ? 1 : (l.heat ?? .3);
    ctx.globalAlpha = !inFocus(l) ? .04 : l.kind === "flow" ? .10 + heat * .45 : l.kind === "peer" ? .2 + heat * .6 : .35;
    ctx.strokeStyle = l.color; ctx.lineWidth = l.kind === "flow" ? 1 + Math.min(2.5, (l.w || 1) * .35) : 1.3;
    ctx.setLineDash(l.dashed ? [4, 4] : []);

    p.p += p.speed;

    ctx.globalAlpha = (inFocus(l) ? 1 : .08) * Math.sin(Math.PI * Math.min(1, p.p)) * .95;
    ctx.fillStyle = p.back ? "#ffffff" : l.color; ctx.shadowColor = l.color; ctx.shadowBlur = 6;

  for (const n of nodes.values()) {
    const { x, y, r } = n, dim = focus && !related.has(n.id);
    ctx.globalAlpha = (dim ? .2 : 1) * (reduceMotion ? 1 : Math.min(1, (performance.now() - n.born) / 400));
    const busy = n.type === "session" ? n.s.busy : n.type === "agent" ? n.a.running : false;
    const waiting = n.type === "session" && n.s.waiting;
    if (busy || waiting) {

      ctx.strokeStyle = waiting ? "#d29922" : n.color; ctx.lineWidth = 1.5;

      ctx.globalAlpha = a0;
    }
    ctx.fillStyle = n.color; ctx.strokeStyle = n.color; ctx.lineWidth = 2;
    ctx.shadowColor = n.color; ctx.shadowBlur = busy ? 10 : 0;
    ctx.beginPath();
    if (n.type === "sink") { ctx.rect(x - r, y - r, r * 2, r * 2); ctx.fillStyle = n.color + "33"; ctx.fill(); ctx.stroke(); }
    else if (n.type === "hub") { for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; ctx[i ? "lineTo" : "moveTo"](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
    else ctx.arc(x, y, r, 0, Math.PI * 2), ctx.fill();
    ctx.shadowBlur = 0;
    if (n === selected) { ctx.strokeStyle = text; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r + 5, 0, Math.PI * 2); ctx.stroke(); }

    const colW = (W * .56 - W * .30) / 7.2;
    if (n.type === "you") label("You", x, y + r + 12, "center", `600 11px ${sans}`, text, 10);
    else if (n.type === "hub") label(n.label, x, y - r - 9, "center", `600 11px ${sans}`, text, 28);
    else if (n.type === "session") {
      label(n.label, x + r + 8, y - 6, "left", `600 12px ${sans}`, text, Math.max(16, colW | 0));
      const s = n.s, tl = s.runningTools[0];
      const doing = s.waiting ? "⏳ waiting for you" : tl ? `▸ ${tl.name}${tl.desc ? ": " + tl.desc : ""}` : s.intent ? "▸ " + s.intent : "▸ thinking";
      label(doing, x + r + 8, y + 9, "left", `10px ${mono}`, s.waiting ? "#d29922" : muted, Math.max(18, (colW * 1.15) | 0));
    } else if (n.type === "agent") {
      label(n.label + (n.a.model ? "  · " + n.a.model : ""), x + r + 7, y, "left", `500 11px ${sans}`, n.a.running ? text : muted, 44);
    } else if (n.type === "sink") label(n.label, x - r - 8, y, "right", `500 11px ${sans}`, text, 26);
  }

}

function frame(t) { spawnParticles(t); draw(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// ---------- Interaction ----------
function pick(x, y) {
  let best = null, bd = 1e9;
  for (const n of nodes.values()) { const d = Math.hypot(n.x - x, n.y - y); if (d < n.r + 8 && d < bd) { bd = d; best = n; } }
  return best;
}
function toggleSelect(n) { selected = n && selected !== n ? n : null; highlightCard(); }
cv.addEventListener("click", (e) => toggleSelect(pick(e.offsetX, e.offsetY)));
cv.addEventListener("mousemove", (e) => { hover = pick(e.offsetX, e.offsetY); cv.style.cursor = hover ? "pointer" : "default"; showTip(hover, e.offsetX, e.offsetY); });
cv.addEventListener("mouseleave", () => { hover = null; tip.style.display = "none"; });

function showTip(n, x, y) {
  if (!n) { tip.style.display = "none"; return; }
  let h = `<div class="t">${esc(n.label)}</div>`;
  if (n.type === "session") {
    const s = n.s;
    h += `<div class="m">${esc(s.surface)} · ${esc(s.repo || s.cwd)} ${s.model ? "· " + esc(s.model) : ""} · ${ago(s.lastEventAt)} ago</div>`;
    if (s.lastUser) h += `<div style="margin-top:4px">💬 ${esc(s.lastUser)}</div>`;
    for (const t of s.runningTools.slice(0, 4)) h += `<div>⚙️ <b>${esc(t.name)}</b> ${esc(t.desc)}</div>`;
    if (s.lastAssistant) h += `<div class="m" style="margin-top:4px">🤖 ${esc(s.lastAssistant)}</div>`;
    if (s.tokens.in) h += `<div class="m">Σ tokens in tail: ${(s.tokens.in / 1000).toFixed(0)}k in / ${(s.tokens.out / 1000).toFixed(0)}k out</div>`;
  } else if (n.type === "agent") {
    const a = n.a;
    h += `<div class="m">sub-agent · ${esc(a.type)} · ${esc(a.model || "")} · ${a.running ? "running" : "done"} ${ago(a.startedAt)}</div>`;
    if (a.doing) h += `<div>⚙️ ${esc(a.doing)}</div>`;
    if (a.said) h += `<div class="m">🤖 ${esc(a.said)}</div>`;
    h += `<div class="m">in ${esc(n.parent.name)}</div>`;
  } else if (n.type === "sink") {
    const ins = links.filter((l) => l.b === n.id).map((l) => nodes.get(l.a)).filter(Boolean);
    h += `<div class="m">data destination · ${ins.length} agent(s) talking to it</div>`;
    for (const s of ins.slice(0, 6)) h += `<div>← ${esc(s.label)}</div>`;
  } else if (n.type === "hub" && n.detail) {
    h += `<div class="m">pid ${n.detail.pid}</div>` + n.detail.folders.map((f) => `<div class="m">${esc(f)}</div>`).join("");
  }
  tip.innerHTML = h; tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(W - tw - 8, x + 14) + "px"; tip.style.top = Math.max(0, Math.min(H - th - 8, y + 14)) + "px";
}

// ---------- Panels ----------
// Write a panel only when its HTML changed. Wait while the user selects text in it, presses
// a pointer button in it, or recently moved the pointer over it (title tooltips).
const HOVER_HOLD_MS = 8000;
const panels = new Map();
let pointerDown = false;
function panelBusy(el, p) {
  const sel = getSelection();
  if (sel && !sel.isCollapsed && (el.contains(sel.anchorNode) || el.contains(sel.focusNode))) return true;
  return p.over && (pointerDown || performance.now() - p.moveAt < HOVER_HOLD_MS);
}
function flushPanel(el, p) {
  if (!p.pending || panelBusy(el, p)) return;
  const { html, after } = p.pending;
  p.pending = null;
  if (html === p.html) return;
  const focusId = el.contains(document.activeElement) ? document.activeElement.dataset.id : null, atTop = el.scrollTop < 4;
  el.innerHTML = html; p.html = html;
  after?.(atTop);
  if (focusId) el.querySelector(`[data-id="${CSS.escape(focusId)}"]`)?.focus({ preventScroll: true });
}
const flushPanels = () => { for (const [el, p] of panels) flushPanel(el, p); };
function setPanel(el, html, after) {
  let p = panels.get(el);
  if (!p) {
    p = { html: null, pending: null, over: false, moveAt: 0 };
    panels.set(el, p);
    el.addEventListener("pointerenter", () => { p.over = true; p.moveAt = performance.now(); });
    el.addEventListener("pointermove", () => { p.moveAt = performance.now(); });
    el.addEventListener("pointerleave", () => { p.over = false; flushPanel(el, p); });
  }
  p.pending = { html, after };
  flushPanel(el, p);
}
addEventListener("pointerdown", () => { pointerDown = true; }, true);
// Wait after the button is released, so that the click reaches the old node first.
const pointerUp = () => { pointerDown = false; setTimeout(flushPanels, 50); };
addEventListener("pointerup", pointerUp, true);
addEventListener("pointercancel", pointerUp, true);
document.addEventListener("selectionchange", () => { if (getSelection()?.isCollapsed) flushPanels(); });

// ---------- Sidebar ----------
function renderSidebar(snap, sessions) {
  const busy = sessions.filter((s) => s.busy).length, wait = sessions.filter((s) => s.waiting).length;
  const subs = sessions.reduce((n, s) => n + s.subagents.filter((a) => a.running).length, 0);
  const flows = sessions.reduce((n, s) => n + s.flows.length, 0);
  document.getElementById("sBusy").textContent = busy;
  document.getElementById("sWait").textContent = wait;
  document.getElementById("sSub").textContent = subs;
  document.getElementById("sAll").textContent = sessions.length;
  document.getElementById("sFlow").textContent = flows;

  const list = document.getElementById("list");
  const destsOf = new Map();
  for (const l of links) if (l.kind === "flow") {
    const src = nodes.get(l.a); if (!src) continue;
    const sid = src.type === "agent" ? "s:" + src.parent.id : src.id;
    if (!destsOf.has(sid)) destsOf.set(sid, new Set());
    destsOf.get(sid).add(l.b.slice(2));
  }
  const cardAttrs = (id) => `tabindex="0" role="button" aria-pressed="${selected?.id === id}" data-id="${esc(id)}"`;
  let listH = !sessions.length ? `<div class="empty">No agents are working right now.</div>` : `<h2>Agents</h2>` + sessions.map((s) => {
    const c = surfaceColor(s.surface);
    const st = s.waiting ? "wait" : s.busy ? "busy" : "";
    const t = s.runningTools[0];
    const doing = s.waiting ? "⏳ waiting for your input / approval"
      : t ? `⚙️ ${t.name}${t.desc ? ": " + t.desc : ""}` : s.busy ? (s.intent ? "🧠 " + s.intent : "🧠 thinking…") : s.lastAssistant ? "✓ " + s.lastAssistant : "";
    const subsH = s.subagents.map((a) => `<div class="sub"><span style="color:${a.running ? "#3fb950" : "inherit"}" aria-label="${a.running ? "running" : "done"}">${a.running ? "●" : "○"}</span> <b>${esc(a.name)}</b> ${esc(a.model || "")}${a.doing ? " — " + esc(a.doing) : ""}</div>`).join("");
    const dests = [...(destsOf.get("s:" + s.id) || [])].sort();
    const destH = dests.length ? `<div class="meta" title="${esc(dests.join(", "))}">→ ${esc(dests.join(", "))}</div>` : "";
    return `<div class="card ${selected?.id === "s:" + s.id ? "sel" : ""}" style="--c:${c}" ${cardAttrs("s:" + s.id)}>
      <div class="row"><div class="dot ${st}"></div><div class="name" title="${esc(s.name)}">${esc(s.name)}</div><span class="pill">${esc(s.surface)}</span></div>
      <div class="meta">${esc(s.repo || s.cwd || "")}${s.model ? " · " + esc(s.model) : ""} · ${ago(s.lastEventAt)} ago</div>
      ${doing ? `<div class="doing" title="${esc(doing)}">${esc(doing)}</div>` : ""}${subsH}${destH}</div>`;
  }).join("");
  const sinkNodes = [...nodes.values()].filter((n) => n.type === "sink").sort((a, b) => a.ty - b.ty);
  if (sinkNodes.length) listH += `<h2>Destinations</h2>` + sinkNodes.map((n) => {
    const from = [...new Set(links.filter((l) => l.b === n.id).map((l) => nodes.get(l.a)?.label).filter(Boolean))];
    return `<div class="card dest ${selected?.id === n.id ? "sel" : ""}" style="--c:${n.color}" ${cardAttrs(n.id)}>
      <div class="row"><div class="name">${esc(n.label)}</div><span class="pill">${from.length}</span></div>
      <div class="meta" title="${esc(from.join(", "))}">← ${esc(from.join(", "))}</div></div>`;
  }).join("");
  // The panel keeps the keyboard focus on the same item when it writes the list again.
  setPanel(list, listH, () => {
    for (const el of list.querySelectorAll(".card")) {
      el.onclick = () => toggleSelect(nodes.get(el.dataset.id));
      el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } };
    }
  });

  const evs = [];
  for (const s of sessions) {
    for (const f of s.flows) if (f.tool !== "model") evs.push({ at: f.endAt || f.at, s, f });
    for (const t of s.runningTools) if (t.sink) evs.push({ at: Date.now(), s, f: { ...t, tool: t.name, live: true } });
    for (const p of s.peers) if (snap.now - p.at < 300e3) evs.push({ at: p.at, s, f: { sink: p.kind === "spawn" ? "spawned session" : "→ " + (sessions.find((x) => x.id === p.to)?.name || p.to.slice(0, 8)), tool: p.kind, desc: p.text, peer: true } });
  }
  evs.sort((a, b) => b.at - a.at);
  renderModels(snap.sessions, snap);
  const subName = (s, aid) => aid ? (s.subagents.find((x) => x.id === aid)?.name || "sub-agent " + String(aid).slice(0, 8)) : "";
  const rows = evs.slice(0, 150).map(({ at, s, f }) => {
    const c = f.peer ? "#f778ba" : sinkColor(f.sink);
    const cls = [f.live ? "live" : "", f.peer ? "peer" : "", f.ok === false ? "fail" : ""].join(" ");
    const who = subName(s, f.agentId);
    return `<tr class="${cls}" style="--c:${c}"><td class="ts">${f.live ? "● live" : ago(at)}</td>`
      + `<td title="${esc(s.name)}"><b>${esc(s.name)}</b>${who ? ` <span class="agent">› ${esc(who)}</span>` : ""}</td>`
      + `<td class="dest" title="${esc(f.sink)}">${esc(f.sink)}</td>`
      + `<td class="agent">${esc(f.tool || "")}</td>`
      + `<td class="cmd" title="${esc(f.desc || "")}"><div>${esc(f.desc || "")}</div></td></tr>`;
  }).join("");
  document.getElementById("feedCount").textContent = evs.length ? `${Math.min(evs.length, 150)} of ${evs.length} events` : "";
  const feed = document.getElementById("feed");
  setPanel(feed, rows
    ? `<table><colgroup><col style="width:58px"><col style="width:22%"><col style="width:150px"><col style="width:120px"><col></colgroup>`
      + `<thead><tr><th>When</th><th>Agent</th><th>Destination</th><th>Tool</th><th>Command / details</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">No data flowing in the last 2 minutes.</div>`, (atTop) => { if (atTop) feed.scrollTop = 0; });
}
function fmtTok(n) { return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(n); }
// Sessions use model ids ("claude-sonnet-4.5"), usage records use display names ("Claude Sonnet 4.5").
const modelKey = (m) => String(m || "").replace(/^.*\//, "").toLowerCase().replace(/[^a-z0-9.]/g, "");
const baseModelKey = (m) => modelKey(String(m || "").replace(/\s*·\s*BYOK$/i, ""));
function renderModels(sessions, snap) {
  const M = new Map(), get = (m) => { const k = modelKey(m); return M.get(k) || (M.set(k, { name: m, recentIn: 0, recentOut: 0, recentCalls: 0, last: 0, active: false, tIn: 0, tOut: 0, tCalls: 0, by: new Map() }), M.get(k)); };
  // Active: the current model of a working or waiting session, or the model of a running sub-agent.
  const activeKeys = new Set();
  for (const s of sessions) {
    if ((s.busy || s.waiting) && s.model) activeKeys.add(baseModelKey(s.model));
    for (const a of s.subagents || []) if (a.running && a.model) activeKeys.add(baseModelKey(a.model));
  }
  for (const s of sessions) {
    for (const [m, t] of Object.entries(s.modelTokens || {})) {
      const x = get(m); x.tIn += t.in; x.tOut += t.out; x.tCalls += t.calls;
    }
    for (const f of s.flows) if (f.tool === "model" && f.model) {
      const x = get(f.model); x.recentIn += f.tin || 0; x.recentOut += f.tout || 0; x.recentCalls++;
      x.last = Math.max(x.last, f.endAt || f.at || 0);
      x.by.set(s.name, (x.by.get(s.name) || 0) + (f.tin || 0) + (f.tout || 0));
    }
  }
  for (const x of M.values()) x.active = activeKeys.has(baseModelKey(x.name));
  const list = [...M.values()].sort((a, b) => (b.active - a.active) || (b.last - a.last) || (b.tIn + b.tOut) - (a.tIn + a.tOut));
  const pal = ["#a371f7", "#2f81f7", "#39c5cf", "#3fb950", "#f778ba", "#d29922", "#ff7b72"];
  const html = list.map((x) => {
    const c = sinkColor("LLM: " + x.name), by = [...x.by.entries()].sort((a, b) => b[1] - a[1]), tot = by.reduce((n, [, v]) => n + v, 0) || 1;
    const bar = by.map(([n, v], i) => `<i title="${esc(n)}: ${fmtTok(v)}" style="width:${(100 * v / tot).toFixed(1)}%;background:${pal[i % pal.length]}"></i>`).join("");
    const who = by.slice(0, 3).map(([n, v], i) => `<span style="color:${pal[i % pal.length]}">●</span> ${esc(n.slice(0, 18))} ${fmtTok(v)}`).join("  ");
    const state = x.active ? `<span class="act">● active</span>` : x.last ? `<span class="ago">${ago(x.last)} ago</span>` : "";
    return `<div class="mdl${x.active ? "" : " idle"}" style="--c:${c}"><div class="top"><span class="nm">${esc(x.name)}</span>${state}<span class="rate" title="tokens per minute, last 2 min">${fmtTok((x.recentIn + x.recentOut) / 2)}/min</span></div>
      <div class="nums"><span></span><span>in</span><span>out</span><span>calls</span>
        <span>2 min</span><b>${fmtTok(x.recentIn)}</b><b>${fmtTok(x.recentOut)}</b><b>${x.recentCalls}</b>
        <span title="all usage seen in the session logs that the radar read">seen</span><b>${fmtTok(x.tIn)}</b><b>${fmtTok(x.tOut)}</b><b>${x.tCalls}</b></div>
      ${by.length ? `<div class="bar">${bar}</div><div class="who">${who}</div>` : ""}</div>`;
  }).join("");
  setPanel(document.getElementById("models"), `<h2>Model tokens</h2>` + (html || `<div class="empty">No model usage.</div>`));
}
function highlightCard() {
  for (const el of document.querySelectorAll(".card")) {
    el.classList.toggle("sel", selected?.id === el.dataset.id);
    el.setAttribute("aria-pressed", String(selected?.id === el.dataset.id));
  }
  if (selected) document.querySelector(`.card[data-id="${CSS.escape(selected.id)}"]`)?.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
}

(() => {
  const grip = document.getElementById("grip"); let y0 = 0, h0 = 0;

  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const saved = store.get("radarFeedH"); if (saved) document.body.style.setProperty("--feedH", saved);
  grip.onpointerdown = (e) => { y0 = e.clientY; h0 = document.getElementById("feedWrap").offsetHeight; grip.setPointerCapture(e.pointerId); };
  grip.onpointermove = (e) => {
    if (!grip.hasPointerCapture(e.pointerId)) return;
    const h = Math.max(80, Math.min(innerHeight - 160, h0 + (y0 - e.clientY)));
    document.body.style.setProperty("--feedH", h + "px"); store.set("radarFeedH", h + "px");
  };
})();

function connect() {
  const es = new EventSource("events");
  es.onmessage = (m) => { document.getElementById("live").classList.remove("off"); build(JSON.parse(m.data)); };
  es.onerror = () => { document.getElementById("live").classList.add("off"); };
}
